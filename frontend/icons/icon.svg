<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Envelope Body -->
  <g filter="url(#glow)">
    <rect x="110" y="150" width="292" height="212" rx="24" fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
    <!-- Flap Fold -->
    <path d="M120 162 L256 270 L392 162" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- AI Sparkle / Star (Top Right) -->
  <path d="M 370 110 Q 370 145 405 145 Q 370 145 370 180 Q 370 145 335 145 Q 370 145 370 110 Z" fill="#fef08a"/>
  <!-- Mini Sparkle -->
  <path d="M 150 120 Q 150 135 165 135 Q 150 135 150 150 Q 150 135 135 135 Q 150 135 150 120 Z" fill="#93c5fd" opacity="0.9"/>
</svg>
